[General]
# Every color and size the theme uses. Overrides go in theme.conf.user next
# to this file (SDDM reads it on top of this one); lyne-dots writes it when
# syncing its palette. Values with a comma must be quoted, or they turn into
# a list.

# ----------------------------------------------------------------------------
# Palette: same keys as the "palette" section of lyne-dots themes
# (~/.local/themes/*.json). Default: Tokyo Night
# ----------------------------------------------------------------------------
background=#1a1b26
surface0=#24283b
surface1=#292e42
surface2=#414868
surface3=#565f89
text=#c0caf5
textReverse=#1a1b26
subtext=#a9b1d6
accent=#7aa2f7
success=#9ece6a
warning=#e0af68
error=#f7768e
muted=#545c7e
# Cards and pills: surface0 at this opacity
backgroundOpacity=0.9

# ----------------------------------------------------------------------------
# Wallpaper: relative to the theme dir, or absolute (readable by the sddm
# user). Empty = the background color alone
# ----------------------------------------------------------------------------
wallpaper=backgrounds/default.jpg
# Blur amount 0..1 and its strength in pixels
blur=1
blurMax=64
# Background color laid over the wallpaper, 0..1
dim=0.45

# ----------------------------------------------------------------------------
# Geometry (lyne-dots Config.qml names)
# ----------------------------------------------------------------------------
radiusSmall=5
radius=10
radiusLarge=15
spacing=8
padding=6

# ----------------------------------------------------------------------------
# Typography. The font must be installed system-wide (/usr/share/fonts)
# ----------------------------------------------------------------------------
font=CaskaydiaCove Nerd Font
fontSizeSmall=12
fontSizeNormal=14
fontSizeLarge=16
fontSizeIconSmall=18
fontSizeIcon=22
fontSizeIconLarge=28

# ----------------------------------------------------------------------------
# Animations, in ms. Popups grow from this scale
# ----------------------------------------------------------------------------
animDurationShort=100
animDuration=200
animDurationLong=400
animPopupFromScale=0.92

# ----------------------------------------------------------------------------
# Clock (Qt date formats). Empty locale = the system one
# ----------------------------------------------------------------------------
clockFormat=HH:mm
dateFormat="dddd, d MMMM"
locale=

# ----------------------------------------------------------------------------
# Power: seconds before reboot / shut down run (Esc cancels), 0 = at once
# ----------------------------------------------------------------------------
powerCountdown=5

# ----------------------------------------------------------------------------
# Test mode (test.sh turns it on): every power button shows and does
# nothing, and logins fail unless the password is "test"
# ----------------------------------------------------------------------------
testMode=false
